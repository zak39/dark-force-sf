services:
  php:
    build: .
    restart: always
    ports:
      - "9100:80" # HTTP
      - "9101:443" # HTTPS
      - "9101:443/udp" # HTTP/3
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "dark-force.zak.dev=127.0.0.1"
      - "dark-force.zak.dev=::1"

volumes:
  caddy_data:
  caddy_config:
